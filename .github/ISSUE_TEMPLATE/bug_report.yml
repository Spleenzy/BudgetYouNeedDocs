name: Zgłoszenie błędu
description: Zgłoś problem z aplikacją Budget You Need.
title: "[Błąd]: "
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy za zgłoszenie. Nie umieszczaj danych finansowych, haseł,
        eksportów danych, danych osobowych ani szczegółów podatności.
  - type: dropdown
    id: platform
    attributes:
      label: Platforma
      options:
        - Android
        - iOS
        - Inna / nie wiem
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Wersja aplikacji
      placeholder: np. 1.0.0
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Model urządzenia i wersja systemu
      placeholder: np. iPhone 15, iOS 18.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroki do odtworzenia
      placeholder: |
        1. Otwórz …
        2. Wybierz …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Oczekiwany rezultat
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Faktyczny rezultat
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Dodatkowy kontekst
      description: Opcjonalnie dołącz zanonimizowany screenshot lub nagranie ekranu.
  - type: checkboxes
    id: privacy
    attributes:
      label: Prywatność
      options:
        - label: Potwierdzam, że zgłoszenie nie zawiera danych osobowych, finansowych, haseł ani eksportów danych.
          required: true
