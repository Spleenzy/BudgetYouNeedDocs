name: Bug report
description: Report a problem with the Budget You Need app.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this issue. Do not include financial data,
        passwords, data exports, personal data, or vulnerability details.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Other / I don't know
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Device model and operating system version
      placeholder: e.g. iPhone 15, iOS 18.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Optionally attach an anonymized screenshot or screen recording.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm that this report contains no personal or financial data, passwords, or data exports.
          required: true
