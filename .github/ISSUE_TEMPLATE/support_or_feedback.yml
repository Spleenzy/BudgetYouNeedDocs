name: Question or feedback
description: Ask a question about the app or suggest an improvement.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        This ticket will be public. Do not include financial data, personal
        data, passwords, data exports, or vulnerability details.
  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - Question about using the app
        - Feature or improvement suggestion
        - Documentation issue
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request details
      description: Describe what you need or what you suggest.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optionally add the app version, device, or an anonymized example.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm that this report contains no personal or financial data, passwords, or data exports.
          required: true
